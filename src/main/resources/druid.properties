# ---------------------------------------------------------------------------
# Alibaba Druid connection pool configuration
# Loaded by DruidDataSourceFactory.createDataSource(Properties).
# Uses an in-memory H2 database so the experiment runs with no external setup.
# ---------------------------------------------------------------------------

# --- JDBC connection ---
druid.url=jdbc:h2:mem:druidexp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
druid.username=sa
druid.password=
druid.driverClassName=org.h2.Driver

# --- Pool sizing ---
druid.initialSize=3
druid.minIdle=3
druid.maxActive=20
druid.maxWait=10000

# --- Idle connection eviction ---
druid.timeBetweenEvictionRunsMillis=60000
druid.minEvictableIdleTimeMillis=300000

# --- Connection validation ---
druid.validationQuery=SELECT 1
druid.testWhileIdle=true
druid.testOnBorrow=false
druid.testOnReturn=false

# --- Prepared statement caching ---
druid.poolPreparedStatements=true
druid.maxPoolPreparedStatementPerConnectionSize=20

# --- Monitoring filters (stat = SQL stats, wall = SQL firewall) ---
druid.filters=stat

# ---------------------------------------------------------------------------
# Deliberately tiny Druid pool used by RequiresNewExhaustionDemo.
#
# maxActive is small so the REQUIRES_NEW nested-borrow deadlock reproduces
# quickly and visibly. maxWait is short so blocked borrows fail fast with a
# GetConnectionTimeoutException instead of hanging forever.
# ---------------------------------------------------------------------------

druid.url=jdbc:h2:mem:requiresnew;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
druid.username=sa
druid.password=
druid.driverClassName=org.h2.Driver

# Small pool: only 5 physical connections available.
druid.initialSize=5
druid.minIdle=5
druid.maxActive=5

# Fail a blocked getConnection() after 3s instead of waiting indefinitely.
druid.maxWait=3000

druid.validationQuery=SELECT 1
druid.testWhileIdle=true
druid.testOnBorrow=false
druid.testOnReturn=false

druid.poolPreparedStatements=false
druid.filters=stat
